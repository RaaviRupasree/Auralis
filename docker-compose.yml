version: '3.8'

services:
  auralis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auralis_app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
      - TTS_ENGINE=edge-tts
      - TTS_VOICE=en-US-ChristopherNeural
      - DB_PATH=/app/data/auralis.db
    volumes:
      - auralis_data:/app/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  auralis_data:
